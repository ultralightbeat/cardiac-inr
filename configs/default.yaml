# Settings used in the report (patient051). The scripts take command-line arguments; this file
# documents the defaults (see scripts/pipeline.py --preset full and docs/DECISIONS.md).
seed: 0
data:
  root: data/acdc
  patient: patient051
  crop_padding_px: 12          # in-plane crop around the expert-labelled heart
model:
  name: siren
  hidden_features: 256
  hidden_layers: 3             # 198,913 parameters with a 4-D input
  first_omega_0: 30.0
  hidden_omega_0: 30.0
  time_encoding: scaled        # raw | scaled | periodic
  time_scale: 0.1
training:
  optimizer: adam
  lr: 1.0e-4                   # cosine decay to 1.0e-5
  batch_size: 16384
  steps: 20000
evaluation:
  e1: every second slice hidden (1, 3, 5, 7)
  e2: every second frame hidden; sparse variant keeps every 4th frame
  metrics: [psnr, ssim, psnr_heart]
